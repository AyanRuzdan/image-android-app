name: Publish Release APK

on:
  push:
    tags: [ "*" ]  # Triggers when a Git tag is pushed

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full git history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Important! Ensures .git is available in Docker container

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Publish APK to GitHub Releases
        uses: alsrb968/action-release-apk@master
        with:
          releaseName: Release ${{ github.ref_name }}  # optional
          files: app/build/outputs/apk/release/*.apk   # optional if your APK isn't in default folder
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          APP_FOLDER: app

